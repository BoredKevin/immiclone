    <!-- TAB: DUPLICATION TRANSACTIONS (STAGE 3 WORKSPACE) -->
    <div class="tab-content" id="content-tx">
      
      <!-- Hidden compatibility elements for Tailscale state synchronization -->
      <span id="ts-badge" style="display:none;"></span>
      <span id="ts-status-desc" style="display:none;"></span>

      <!-- Transactions Section Header & Controls -->
      <div class="section-head" style="margin-top: 4px;">
        <div class="section-title">
          <svg class="icon icon-sm" viewBox="0 0 24 24">
            <polyline points="1 4 1 10 7 10"></polyline>
            <polyline points="23 20 23 14 17 14"></polyline>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
          </svg>
          <span>Duplication Transactions</span>
          <div class="filter-chips" style="margin-left: 12px;">
            <span class="chip active" id="tx-filter-all" data-action="filter-tx" data-filter="all">All (<span id="count-tx-all">0</span>)</span>
            <span class="chip" id="tx-filter-running" data-action="filter-tx" data-filter="running">Running (<span id="count-tx-running">0</span>)</span>
            <span class="chip" id="tx-filter-queued" data-action="filter-tx" data-filter="queued">Queued (<span id="count-tx-queued">0</span>)</span>
            <span class="chip" id="tx-filter-paused" data-action="filter-tx" data-filter="paused">Paused (<span id="count-tx-paused">0</span>)</span>
            <span class="chip" id="tx-filter-completed" data-action="filter-tx" data-filter="completed">Completed (<span id="count-tx-completed">0</span>)</span>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-sm btn-ghost" data-action="open-modal" data-target="worker-launcher" title="Launch or inspect compute workers">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            Workers Modal
          </button>
          <button class="btn btn-sm btn-danger" data-action="clear-completed-tx">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear Finished
          </button>
          <button class="btn btn-primary" data-action="open-modal" data-target="new-tx">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New Transaction
          </button>
        </div>
      </div>

      <div id="transactions-container">
        <div class="empty-state card" id="tx-empty-state">
          <div style="font-size:14px; font-weight:600; color:var(--heading); margin-bottom:6px;">No duplication transactions configured</div>
          <div style="color:var(--text-muted); font-size:12px; margin-bottom:14px;">Create a replication transaction to start copying or syncing files between remotes.</div>
          <div class="btn-group" style="justify-content:center;">
            <button class="btn btn-sm btn-accent" data-action="guided-create-tx" data-preset="gdrive-mirror">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path><polyline points="16 16 12 12 8 16"></polyline></svg>
              Preset: Google Drive Cloud Mirror
            </button>
            <button class="btn btn-sm" data-action="guided-create-tx" data-preset="local-ssd-backup">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect></svg>
              Preset: Local SSD Backup
            </button>
            <button class="btn btn-sm btn-primary" data-action="open-modal" data-target="new-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              + Custom Transaction
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- DECLARATIVE HTML5 TEMPLATES -->

    <!-- Template: Transaction Card (Persistent DOM + Toggleable Actions) -->
    <template id="tpl-tx-card">
      <div class="tx-card" data-key="">
        <div class="tx-header">
          <div>
            <div class="tx-title-row">
              <span class="tx-title" data-bind="title"></span>
              <span class="tx-route mono" data-bind="route"></span>
              <span class="tx-mode-tag" data-bind="mode"></span>
              <span class="badge" data-bind="status-badge"></span>
            </div>
            <div class="tx-meta">
              <span>ID: <code class="mono" style="color:var(--heading);" data-bind="tx-id"></code></span>
              <span class="tx-meta-sep">&bull;</span>
              <span>Flags: <span data-bind="flags-container"></span></span>
              <span data-bind="notes-wrap"></span>
            </div>
          </div>
          <div class="tx-assigned-worker">
            <span class="tx-assigned-label">Assigned Worker</span>
            <div data-bind="worker-pill-wrap">
              <strong class="mono tx-assigned-name" data-bind="worker-name">None</strong>
            </div>
          </div>
        </div>

        <div class="tx-details-well">
          <div class="tx-detail-item">
            <span class="tx-detail-label">Progress</span>
            <span class="tx-detail-val tabular-nums" data-bind="progress-text">0% (0.00 GB / 0.00 GB)</span>
          </div>
          <div class="tx-detail-item">
            <span class="tx-detail-label">Speed</span>
            <span class="tx-detail-val tabular-nums" data-bind="speed">0 B/s</span>
          </div>
          <div class="tx-detail-item">
            <span class="tx-detail-label">Files Copied</span>
            <span class="tx-detail-val tabular-nums" data-bind="files">0 copied (0 checked)</span>
          </div>
          <div class="tx-detail-item">
            <span class="tx-detail-label">ETA</span>
            <span class="tx-detail-val tabular-nums" data-bind="eta">-</span>
          </div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" data-bind="progress-fill" style="width: 0%"></div>
        </div>
        <div class="mono tx-current-file">
          <span class="tx-current-label">Current:</span> <span data-bind="current-file">Idle</span>
        </div>

        <!-- Declarative Action Buttons (Toggled via .hidden to preserve focus & state) -->
        <div class="tx-actions">
          <!-- Running State Actions -->
          <div class="btn-group hidden" data-bind="actions-running">
            <button class="btn btn-sm" data-action="pause-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
              Pause
            </button>
            <button class="btn btn-sm btn-danger" data-action="cancel-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"></rect></svg>
              Cancel
            </button>
          </div>

          <!-- Pending/Paused/Queued Actions -->
          <div class="btn-group hidden" data-bind="actions-pending">
            <div data-bind="assign-group" style="display:inline-flex; align-items:center; gap:6px;">
              <select class="form-select" data-bind="assign-select" style="width:auto; max-width:240px; padding:5px 9px; font-size:12px;"></select>
              <button class="btn btn-sm btn-accent" data-action="assign-tx">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <span data-bind="assign-btn-label">Start on Worker</span>
              </button>
            </div>
            <div class="hidden" data-bind="no-workers-msg" style="display:inline-flex; align-items:center; gap:8px;">
              <span style="font-size:12px; color:var(--text-muted);">No worker online.</span>
              <button class="btn btn-sm btn-accent" data-action="open-modal" data-target="worker-launcher">
                <svg class="icon icon-xs" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Launch Free Cloud Worker
              </button>
            </div>
            <button class="btn btn-sm" data-action="edit-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              Edit
            </button>
            <button class="btn btn-sm" data-action="reset-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
              Reset Progress
            </button>
            <button class="btn btn-sm btn-danger" data-action="delete-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              Delete
            </button>
          </div>

          <!-- Completed State Actions -->
          <div class="btn-group hidden" data-bind="actions-completed">
            <button class="btn btn-sm btn-accent" data-action="requeue-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
              Re-Queue
            </button>
            <button class="btn btn-sm" data-action="edit-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              Edit
            </button>
            <button class="btn btn-sm btn-danger" data-action="delete-tx">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              Delete
            </button>
          </div>
        </div>
      </div>
    </template>
