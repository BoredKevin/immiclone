    <!-- UNIFIED LIBRARY & SYNC ACTIVITY WORKSPACE (STAGES 1 & 2) -->
    <div class="tab-content active" id="content-media">
      
    <!-- UNIFIED 50/50 SPLIT: ACTIVE TRANSFERS & ISP BANDWIDTH MONITOR -->
    <div class="active-transfers-split-grid" id="active-transfers-split-container">
      
      <!-- LEFT (50%): PINNED ACTIVE UPLOADS SECTION -->
      <div class="pinned-uploads-card" id="pinned-uploads-section">
        <div class="pinned-header-bar">
          <div class="section-title">
            <svg class="icon icon-sm" viewBox="0 0 24 24" style="color:var(--accent);">
              <polyline points="16 16 12 12 8 16"></polyline>
              <line x1="12" y1="12" x2="12" y2="21"></line>
              <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
            </svg>
            <span>Active Cloud Transfers</span>
            <span class="badge badge-running" style="font-size:11px; margin-left:8px;">
              <span class="status-dot dot-green dot-pulse"></span>
              <span id="count-active" class="tabular-nums">0</span> Active
            </span>
          </div>

          <div class="btn-group">
            <button class="btn btn-sm btn-header" id="btn-toggle-pause" data-action="toggle-mount-pause" title="Pause or resume cloud uploads">
              <span id="pause-btn-icon">
                <svg class="icon icon-xs" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
              </span>
              <span id="pause-btn-text">Pause Uploads</span>
            </button>
          </div>
        </div>

        <div class="pinned-table-wrap">
          <table class="pinned-table">
            <thead>
              <tr>
                <th style="width: 40%;">File Name</th>
                <th style="width: 32%;">Progress / Status</th>
                <th style="text-align: right; width: 14%;">Speed</th>
                <th style="text-align: right; width: 14%;">ETA</th>
              </tr>
            </thead>
            <tbody id="jobs-table-body">
              <tr id="jobs-empty-row"><td colspan="4" class="empty-state" id="jobs-empty-msg">No active uploads right now. Mount cache is quiescent.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- RIGHT (50%): ISP BANDWIDTH & HEALTH MONITOR CARD -->
      <!-- include: partials/bandwidth_card.html -->

    </div>

      <!-- UNIFIED LIFECYCLE FILTER BAR & CONTROLS -->
      <div class="controls" style="margin-top: 14px;">
        <div class="search-box">
          <svg class="icon search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-input" id="search" placeholder="Search file names, folders, year/month..." data-input="search-media">
        </div>

        <div class="filter-controls-group">
          <div class="btn-group">
            <button class="btn btn-sm active" id="filter-all" data-action="filter-media" data-filter="all">
              All Media (<span id="count-media-all" class="tabular-nums">0</span>)
            </button>
            <button class="btn btn-sm" id="filter-uploading" data-action="filter-media" data-filter="uploading">
              <span class="status-dot dot-green dot-pulse"></span>
              Uploading (<span id="count-media-uploading" class="tabular-nums">0</span>)
            </button>
            <button class="btn btn-sm" id="filter-failed" data-action="filter-media" data-filter="failed">
              <span class="status-dot dot-red"></span>
              Failed (<span id="count-media-failed" class="tabular-nums">0</span>)
            </button>
            <button class="btn btn-sm" id="filter-cached" data-action="filter-media" data-filter="cached">
              <span class="status-dot dot-blue"></span>
              Cached on SSD (<span id="count-media-cached" class="tabular-nums">0</span>)
            </button>
            <button class="btn btn-sm" id="filter-cloud" data-action="filter-media" data-filter="cloud">
              <span class="status-dot dot-gray"></span>
              Cloud Only (<span id="count-media-cloud" class="tabular-nums">0</span>)
            </button>
          </div>

          <!-- 1-Click Action to Retry Failed Transfers -->
          <button class="btn btn-sm btn-accent hidden" id="btn-retry-failed" data-action="retry-failed-uploads" title="Retry all failed upload transactions">
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Retry All Failed
          </button>
        </div>
      </div>

      <!-- MAIN MEDIA CATALOG TABLE -->
      <table>
        <thead>
          <tr>
            <th class="sortable" data-action="sort-media" data-col="status">
              Status <span class="sort-icon" id="sort-icon-status">↕</span>
            </th>
            <th class="sortable" data-action="sort-media" data-col="path">
              File Path <span class="sort-icon" id="sort-icon-path">↕</span>
            </th>
            <th class="sortable" data-action="sort-media" data-col="size">
              Size <span class="sort-icon" id="sort-icon-size">↕</span>
            </th>
            <th class="sortable" data-action="sort-media" data-col="mtime" title="File Last Modified (mtime)">
              Date Added / Modified <span class="sort-icon" id="sort-icon-mtime">↕</span>
            </th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr id="table-empty-row"><td colspan="4" class="empty-state">Loading media catalog...</td></tr>
        </tbody>
      </table>

      <!-- PAGINATION -->
      <div class="pagination">
        <div class="page-info" id="page-display">Showing 0 of 0 items</div>
        <div class="btn-group">
          <button class="btn btn-sm" id="btn-prev" data-action="change-page" data-delta="-1" disabled>
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Previous
          </button>
          <button class="btn btn-sm" id="btn-next" data-action="change-page" data-delta="1" disabled>
            Next
            <svg class="icon icon-sm" viewBox="0 0 24 24">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- DECLARATIVE HTML5 TEMPLATES -->

    <!-- Template: Active Upload Job Row -->
    <template id="tpl-job-row">
      <tr data-key="">
        <td>
          <div class="file-path-cell" data-bind="file-cell"></div>
        </td>
        <td style="width: 260px;">
          <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px;" class="tabular-nums">
            <span style="font-weight:600;" data-bind="progress-label">0%</span>
            <span style="color:var(--text-muted);" data-bind="bytes-label">0 B / 0 B</span>
          </div>
          <div class="progress-bar" style="margin-top: 4px;">
            <div class="progress-fill green" data-bind="progress-bar" style="width: 0%"></div>
          </div>
        </td>
        <td class="tabular-nums" style="text-align:right; color:var(--green-light); font-weight:600;" data-bind="speed">0 B/s</td>
        <td class="tabular-nums" style="text-align:right;" data-bind="eta">-</td>
      </tr>
    </template>

    <!-- Template: Recent / Completed / Failed Row -->
    <template id="tpl-recent-row">
      <tr data-key="">
        <td>
          <div class="file-path-cell" data-bind="file-cell"></div>
        </td>
        <td>
          <span class="badge" data-bind="status-badge">Committed</span>
        </td>
        <td class="tabular-nums" style="text-align:right; color:var(--text-muted);" data-bind="size">0 B</td>
        <td class="tabular-nums" style="text-align:right; color:var(--text-muted); font-size:12px;" data-bind="time">-</td>
      </tr>
    </template>

    <!-- Template: Media Catalog Row -->
    <template id="tpl-media-row">
      <tr data-key="">
        <td>
          <span class="status-cell" data-bind="status-cell">
            <span class="status-dot" data-bind="status-dot"></span>
            <span data-bind="status-text"></span>
          </span>
        </td>
        <td class="mono path-text" style="font-size:12px; color:var(--heading);" data-bind="path"></td>
        <td class="tabular-nums" data-bind="size">0 B</td>
        <td class="tabular-nums" style="color:var(--text-muted); font-size:12px;" data-bind="mtime">-</td>
      </tr>
    </template>
