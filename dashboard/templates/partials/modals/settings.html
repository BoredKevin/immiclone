  <!-- 5. GLOBAL APPLICATION SETTINGS MODAL -->
  <div class="modal-overlay" id="modal-settings">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">
          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          System Settings & Storage Paths
        </div>
        <button class="modal-close" data-action="close-modal" data-target="settings">
          <svg class="icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="form-group">
        <label>Primary Cloud Remote</label>
        <input type="text" class="form-input mono" id="settings-primary-remote" placeholder="bkc:">
        <div class="form-hint">Authoritative remote used for library scans, free capacity, and duplication defaults.</div>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>VFS Cache Limit (GB)</label>
          <input type="number" step="0.5" class="form-input mono" id="settings-vfs-cache-max" placeholder="10.0">
        </div>
        <div class="form-group">
          <label>Rclone RC URL</label>
          <input type="text" class="form-input mono" id="settings-rc-url" placeholder="http://localhost:5572">
        </div>
      </div>
      <div class="form-group">
        <label>Library Mount Base Path</label>
        <input type="text" class="form-input mono" id="settings-mount-base" placeholder="/mnt/gda/library/library">
      </div>
      <div class="form-group">
        <label>VFS Cache Directory Path</label>
        <input type="text" class="form-input mono" id="settings-cache-base" placeholder="/var/cache/rclone-gda/vfs/bkc/library/library">
      </div>
      <div class="modal-footer">
        <button class="btn" data-action="close-modal" data-target="settings">Cancel</button>
        <button class="btn btn-primary" data-action="save-settings">Save Settings</button>
      </div>
    </div>
  </div>
