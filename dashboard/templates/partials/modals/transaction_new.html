  <!-- 2. CREATE TRANSACTION MODAL -->
  <div class="modal-overlay" id="modal-new-tx">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">
          <svg class="icon" viewBox="0 0 24 24">
            <polyline points="16 16 12 12 8 16"></polyline>
            <line x1="12" y1="12" x2="12" y2="21"></line>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
          </svg>
          New Duplication Transaction
        </div>
        <button class="modal-close" data-action="close-modal" data-target="new-tx">
          <svg class="icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="form-group">
        <label>Transaction Title</label>
        <input type="text" class="form-input" id="tx-title" placeholder="e.g. Daily Media Mirror">
      </div>

      <div class="form-group">
        <label>Source Remote / Path</label>
        <input type="text" class="form-input mono" id="tx-source" placeholder="e.g. remote1:path" list="source-remotes-list">
        <datalist id="source-remotes-list"></datalist>
      </div>

      <div class="form-group">
        <label>Destination Remote / Path</label>
        <input type="text" class="form-input mono" id="tx-dest" placeholder="e.g. remote2:path" list="dest-remotes-list">
        <datalist id="dest-remotes-list"></datalist>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>Transfer Mode</label>
          <select class="form-select" id="tx-mode">
            <option value="copy" selected>copy (Safe - adds/updates files)</option>
            <option value="sync">sync (Mirrors dest to match src)</option>
            <option value="check">check (Verifies integrity only)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select class="form-select" id="tx-priority">
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Rclone Flags (Space-separated)</label>
        <input type="text" class="form-input mono" id="tx-flags" placeholder="e.g. --size-only --transfers=4 --checkers=8">
        <div class="form-hint" id="tx-flags-hint">Optional CLI flags passed directly to the rclone execution runner.</div>
      </div>

      <div class="form-group">
        <label>Notes (Optional)</label>
        <input type="text" class="form-input" id="tx-notes" placeholder="e.g. Scheduled replication task">
      </div>

      <div class="modal-footer">
        <button class="btn" data-action="close-modal" data-target="new-tx">Cancel</button>
        <button class="btn btn-primary" data-action="submit-create-tx">Create Transaction</button>
      </div>
    </div>
  </div>
