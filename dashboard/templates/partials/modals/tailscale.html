  <!-- 1. TAILSCALE CONFIGURATION MODAL -->
  <div class="modal-overlay" id="modal-tailscale">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Tailscale Network Configuration
        </div>
        <button class="modal-close" data-action="close-modal" data-target="tailscale" title="Close">
          <svg class="icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="form-group">
        <label>Configuration Mode</label>
        <select class="form-select" id="ts-mode" data-change="toggle-ts-mode">
          <option value="auth_key">Tailscale Pre-Auth Key (Reusable / Ephemeral)</option>
          <option value="api">Tailscale API Key</option>
          <option value="oauth">Tailscale OAuth Client (Enterprise / Recommended)</option>
        </select>
      </div>

      <div id="ts-fields-auth">
        <div class="form-group">
          <label>Tailscale Auth Key</label>
          <input type="password" class="form-input" id="ts-auth-key" placeholder="tskey-auth-k...">
          <div class="form-hint">Create in Tailscale Admin Console: Settings ➔ Keys ➔ Generate auth key. Recommended tags: <code>tag:worker</code>.</div>
        </div>
      </div>

      <div id="ts-fields-api" style="display:none;">
        <div class="form-group">
          <label>Tailnet Name</label>
          <input type="text" class="form-input" id="ts-tailnet" placeholder="e.g. boredkevin.org.github">
        </div>
        <div class="form-group">
          <label>Tailscale API Key</label>
          <input type="password" class="form-input" id="ts-api-key" placeholder="tskey-api-...">
        </div>
      </div>

      <div id="ts-fields-oauth" style="display:none;">
        <div class="form-group">
          <label>OAuth Client ID</label>
          <input type="text" class="form-input" id="ts-oauth-id" placeholder="k...">
        </div>
        <div class="form-group">
          <label>OAuth Client Secret</label>
          <input type="password" class="form-input" id="ts-oauth-secret" placeholder="tskey-client-...">
        </div>
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:8px; margin-top:16px;">
        <input type="checkbox" id="ts-auto-inject" checked>
        <label for="ts-auto-inject" style="margin-bottom:0; cursor:pointer; text-transform:none;">Automatically inject into worker one-liner commands</label>
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="ts-ephemeral" checked>
        <label for="ts-ephemeral" style="margin-bottom:0; cursor:pointer; text-transform:none;">Auto-register workers as ephemeral nodes (auto-cleanup on disconnect)</label>
      </div>

      <div class="modal-footer">
        <button class="btn btn-danger" data-action="delete-tailscale" style="margin-right:auto;">Clear Key</button>
        <button class="btn" data-action="test-tailscale">Test Connection</button>
        <button class="btn" data-action="close-modal" data-target="tailscale">Cancel</button>
        <button class="btn btn-primary" data-action="save-tailscale">Save Configuration</button>
      </div>
    </div>
  </div>
